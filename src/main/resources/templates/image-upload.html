<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像アップロード</title>
    <link rel="stylesheet" th:href="@{/sample.css}">
</head>

<body>
    <div th:replace="fragments/layout :: header"></div>

    <div class="upload-container">
        <h1>画像アップロード</h1>

        <!-- メッセージ表示 -->
        <div th:if="${message}"
            th:class="|message ${#strings.contains(message, '失敗') or #strings.contains(message, 'ファイル') ? 'error' : 'success'}|">
            <p th:text="${message}"></p>
        </div>

        <form method="post" enctype="multipart/form-data" th:action="@{/image/upload}">
            <div class="form-group">
                <label for="imageFile">画像ファイルを選択:</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*" required>
                <small style="display: block; margin-top: 8px; color: #666;">
                    対応形式: JPG, PNG, GIF, WebP (最大5MB)
                </small>
            </div>

            <div class="form-group">
                <button type="submit">アップロード</button>
            </div>
        </form>

        <a th:href="@{/}" class="back-link">ホームに戻る</a>
    </div>

    <div th:replace="fragments/layout :: footer"></div>
</body>

</html>
